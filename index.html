<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>US Real Estate Wholesaling & Valuation Platform | Cash Offers & Off-Market Deals</title>
    <meta name="description" content="Sell your house as-is for cash or acquire high-margin off-market wholesale properties across key US metros. Automated ARV valuation, 70% rule MAO calculator, and instant closing." />
    
    <!-- OpenGraph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="US Real Estate Wholesaling & Valuation Platform" />
    <meta property="og:description" content="Instant automated property valuation, 7-minute cash offers, and verified wholesale contract inventory across high-velocity US real estate markets." />
    <meta property="og:site_name" content="US Wholesale Realty Exchange" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="US Real Estate Wholesaling & Valuation Platform" />
    <meta name="twitter:description" content="Instant automated property valuation, 7-minute cash offers, and verified wholesale contract inventory across high-velocity US real estate markets." />

    <!-- Theme & Color Scheme -->
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Schema.org JSON-LD Structured Data for Local SEO & Real Estate Wholesaling -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "RealEstateAgent",
          "@id": "https://us-wholesale-realty.com/#organization",
          "name": "US Wholesale Realty & Property Acquisition Network",
          "description": "Premier nationwide wholesale property disposition and acquisition network providing instant automated cash offers and direct-to-investor contract assignments.",
          "areaServed": [
            { "@type": "AdministrativeArea", "name": "Texas" },
            { "@type": "AdministrativeArea", "name": "Georgia" },
            { "@type": "AdministrativeArea", "name": "Florida" },
            { "@type": "AdministrativeArea", "name": "Arizona" },
            { "@type": "AdministrativeArea", "name": "North Carolina" },
            { "@type": "AdministrativeArea", "name": "Ohio" },
            { "@type": "AdministrativeArea", "name": "Tennessee" },
            { "@type": "AdministrativeArea", "name": "Pennsylvania" }
          ],
          "currenciesAccepted": "USD",
          "paymentAccepted": "Cash, Wire Transfer, Title Escrow",
          "priceRange": "$50,000 - $1,500,000"
        },
        {
          "@type": "WebApplication",
          "name": "Automated Real Estate Wholesaling Valuation Engine",
          "applicationCategory": "RealEstateApplication",
          "operatingSystem": "All modern browsers, iOS, Android",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does real estate wholesaling work for home sellers?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A real estate wholesaler contracts distressed or motivated properties directly with homeowners for a guaranteed cash amount with zero fees, closing costs, or repair requirements, then assigns the equitable contract to an end cash buyer/investor for an assignment fee."
              }
            },
            {
              "@type": "Question",
              "name": "What is the 70% rule in wholesale property valuation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The 70% rule states that Maximum Allowable Offer (MAO) equals (After Repair Value [ARV] × 70%) minus Estimated Repair Costs minus Wholesaler Assignment Fee."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-500/20 selection:text-amber-500">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
